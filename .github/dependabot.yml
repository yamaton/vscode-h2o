version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime-dependencies:
        dependency-type: production
        exclude-patterns:
          - web-tree-sitter
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # node-fetch v3 is ESM-only and removes the v2 timeout option used here.
      - dependency-name: node-fetch
        update-types:
          - version-update:semver-major
      # Keep the parser on its current compatible minor line; pre-1.0 minor bumps
      # require coordinated runtime and grammar updates.
      - dependency-name: web-tree-sitter
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Keep the API types aligned with the minimum supported VS Code version.
      - dependency-name: "@types/vscode"
      # Keep Node.js types aligned with the minimum supported VS Code runtime.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

name: Publish Marketplace

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-marketplace
  queue: max
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Detect version bump
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out main commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the previous manifest
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: git show "${BEFORE_SHA}:package.json" > "${RUNNER_TEMP}/previous-package.json"

      - name: Validate release metadata
        id: release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/detect-release.mjs "${RUNNER_TEMP}/previous-package.json" "${RELEASE_SHA}"

  quality:
    name: Re-run release quality gate
    needs: release-metadata
    if: needs.release-metadata.outputs.release == 'true'
    uses: ./.github/workflows/quality.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish verified platform packages
    needs:
      - release-metadata
      - quality
    if: needs.release-metadata.outputs.release == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: marketplace
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out approved release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-metadata.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked release tooling
        run: npm ci

      - name: Download verified platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vscode-h2o-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Re-verify downloaded release packages
        run: npm run verify:release-artifacts

      - name: Require a Marketplace credential
        run: node -e "require('node:assert/strict').ok(process.env.VSCE_PAT, 'VSCE_PAT is required to publish Marketplace packages')"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Verify Marketplace publishing rights
        run: npx --no-install vsce verify-pat tetradresearch
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: node scripts/ensure-release-tag.mjs "${RELEASE_VERSION}" "${RELEASE_SHA}"

      - name: Publish all targets to Visual Studio Marketplace
        run: npm run publish:marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  confirm:
    name: Confirm Marketplace release
    needs:
      - release-metadata
      - publish
    if: needs.release-metadata.outputs.release == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out approved release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-metadata.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked release tooling
        run: npm ci

      - name: Confirm the Marketplace version
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: node scripts/confirm-marketplace-version.mjs "${RELEASE_VERSION}"

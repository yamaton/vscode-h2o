name: Publish Marketplace

on:
  push:
    tags:
      - '*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Version tag and main ancestry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tagged commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match tag to extension version
        run: node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Require tagged commit on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  quality:
    name: Re-run release quality gate
    needs: release-metadata
    uses: ./.github/workflows/quality.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish verified platform packages
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: marketplace
    steps:
      - name: Check out tagged release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked release tooling
        run: npm ci

      - name: Download verified platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vscode-h2o-*-${{ github.sha }}
          path: artifacts
          merge-multiple: true

      - name: Re-verify downloaded release packages
        run: npm run verify:release-artifacts

      - name: Publish all targets to Visual Studio Marketplace
        run: npm run publish:marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

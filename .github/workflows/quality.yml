name: Quality Gate

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-package:
    name: Unit, native, and VSIX contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run static and unit gates
        run: npm run check:unit

      - name: Audit packaged dependencies
        run: npm run audit:prod

      - name: Verify pinned immutable H2O release
        run: npm run h2o:verify-release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate every pinned H2O release asset
        run: npm run h2o:fetch -- --all
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and verify VSIX
        run: npm run package:verify
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Activate the packaged VSIX
        run: xvfb-run -a npm run test:vsix
        env:
          VSCODE_VERSION: stable
          VSCODE_TEST_NO_SANDBOX: '1'

      - name: Activate the packaged VSIX at the engine floor
        run: xvfb-run -a npm run test:vsix
        env:
          VSCODE_VERSION: 1.101.0
          VSCODE_TEST_NO_SANDBOX: '1'

      - name: Upload verified VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-h2o-linux-x64-${{ github.sha }}
          path: artifacts/vscode-h2o-linux-x64.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-platforms:
    name: VSIX contract (${{ matrix.target }})
    needs: unit-and-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: alpine-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-arm64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify platform VSIX
        run: npm run package:platform -- --target ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload verified platform VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-h2o-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/vscode-h2o-${{ matrix.target }}.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  integration-windows:
    name: Packaged Extension Host (stable / Windows x64, scannerless)
    needs: package-platforms
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build packaged smoke test
        run: npm run build

      - name: Download verified Windows x64 VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-h2o-win32-x64-${{ github.sha }}
          path: artifacts

      - name: Activate scannerless Windows VSIX
        run: node ./out/test/runVsixTest.js artifacts/vscode-h2o-win32-x64.vsix
        env:
          VSCODE_H2O_EXPECT_SCANNERLESS_WINDOWS: '1'

  integration-linux:
    name: Extension Host (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: stable / Linux
            runner: ubuntu-24.04
            vscode-version: stable
          - label: VS Code 1.101.0 / Linux
            runner: ubuntu-22.04
            vscode-version: 1.101.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build extension and tests
        run: npm run build

      - name: Run Extension Host integration checks
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
          VSCODE_TEST_NO_SANDBOX: '1'

  integration-macos-intel:
    name: Extension Host and native scanner (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build extension and tests
        run: npm run build

      - name: Prepare verified H2O bundle
        run: |
          npm run h2o:fetch -- --target x86_64-apple-darwin
          node scripts/stage-h2o-bundle.mjs darwin-x64
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify bundled macOS scanner
        run: npm run verify:native -- darwin-x64

      - name: Run stable Extension Host integration checks
        run: npm run test:integration
        env:
          VSCODE_VERSION: stable

  performance-shadow:
    name: Provider performance (shadow)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false

      - name: Check out pull request base source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Select comparison sources
        id: comparison
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          target_root="${GITHUB_WORKSPACE}/target"
          if [[ -f "${GITHUB_WORKSPACE}/base/package.json" ]] \
            && grep -Fq '"test:performance:ci"' "${GITHUB_WORKSPACE}/base/package.json"; then
            echo "arm_a_root=${GITHUB_WORKSPACE}/base" >> "${GITHUB_OUTPUT}"
            echo "arm_a_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "has_base_harness=true" >> "${GITHUB_OUTPUT}"
          else
            echo "arm_a_root=${target_root}" >> "${GITHUB_OUTPUT}"
            echo "arm_a_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
            echo "has_base_harness=false" >> "${GITHUB_OUTPUT}"
            echo "Base performance harness is unavailable; this bootstrap run will use A/A."
          fi
          echo "arm_b_root=${target_root}" >> "${GITHUB_OUTPUT}"
          echo "arm_b_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Install locked target dependencies
        working-directory: target
        run: npm ci

      - name: Install and build the base source
        if: steps.comparison.outputs.has_base_harness == 'true'
        working-directory: base
        run: |
          npm ci
          npm run build

      - name: Measure and evaluate provider performance
        working-directory: target
        run: xvfb-run -a npm run test:performance:ci
        env:
          VSCODE_VERSION: 1.135.0
          VSCODE_TEST_NO_SANDBOX: '1'
          VSCODE_H2O_PERFORMANCE_ARM_A_ROOT: ${{ steps.comparison.outputs.arm_a_root }}
          VSCODE_H2O_PERFORMANCE_ARM_A_SHA: ${{ steps.comparison.outputs.arm_a_sha }}
          VSCODE_H2O_PERFORMANCE_ARM_B_ROOT: ${{ steps.comparison.outputs.arm_b_root }}
          VSCODE_H2O_PERFORMANCE_ARM_B_SHA: ${{ steps.comparison.outputs.arm_b_sha }}
          VSCODE_H2O_PERFORMANCE_GATE_MODE: shadow

      - name: Add performance results to the job summary
        if: always()
        shell: bash
        run: |
          summary="${GITHUB_WORKSPACE}/target/artifacts/provider-performance-summary.md"
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-performance-${{ github.sha }}
          path: |
            target/artifacts/provider-performance.json
            target/artifacts/provider-performance-evaluation.json
            target/artifacts/provider-performance-summary.md
          if-no-files-found: warn
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - unit-and-package
      - package-platforms
      - integration-linux
      - integration-macos-intel
      - performance-shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to pass
        env:
          UNIT_AND_PACKAGE: ${{ needs.unit-and-package.result }}
          PACKAGE_PLATFORMS: ${{ needs.package-platforms.result }}
          INTEGRATION_LINUX: ${{ needs.integration-linux.result }}
          INTEGRATION_MACOS_INTEL: ${{ needs.integration-macos-intel.result }}
          PERFORMANCE_SHADOW: ${{ needs.performance-shadow.result }}
        run: |
          for result in "${UNIT_AND_PACKAGE}" "${PACKAGE_PLATFORMS}" "${INTEGRATION_LINUX}" "${INTEGRATION_MACOS_INTEL}"; do
            if [[ "${result}" != success ]]; then
              echo "A required quality job concluded with: ${result}" >&2
              exit 1
            fi
          done
          if [[ "${PERFORMANCE_SHADOW}" != success && "${PERFORMANCE_SHADOW}" != skipped ]]; then
            echo "The performance shadow job concluded with: ${PERFORMANCE_SHADOW}" >&2
            exit 1
          fi
